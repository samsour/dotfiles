

# This config is a STUB! This should never be generated.
# Use the default lua config from https://github.com/hyprwm/Hyprland/blob/main/example/hyprland.lua

autogenerated = 0

$mainMod = SUPER
$terminal = kitty
$fileManager = nautilus
$menu = fuzzel

bind = $mainMod, Q, exec, $terminal
bind = $mainMod, C, killactive,
bind = $mainMod, M, exec, command -v hyprshutdown >/dev/null 2>&1 && hyprshutdown || hyprctl dispatch exit
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, V, togglefloating,
bind = $mainMod, SPACE, exec, $menu
bind = $mainMod, B, exec, firefox

bind = SUPER SHIFT, C, exec, kitty -e nano ~/.config/hypr/hyprland.conf

# Shrink windows using Arrow keys
binde = SUPER ALT, left,  resizeactive, -40 0
binde = SUPER ALT, right, resizeactive, 40 0
binde = SUPER ALT, up,    resizeactive, 0 -40
binde = SUPER ALT, down,  resizeactive, 0 40

bindm = SUPER, mouse:272, movewindow

# Auf Workspaces 1 bis 4 wechseln
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4

# Aktives Fenster auf Workspaces 1 bis 4 verschieben (mit SHIFT)
bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4

# Move focus
bind = SUPER, left,  movefocus, l
bind = SUPER, right, movefocus, r
bind = SUPER, up,    movefocus, u
bind = SUPER, down,  movefocus, d
# Cycle forward
bind = SUPER, Tab, cyclenext,
# Cycle backward
bind = SUPER SHIFT, Tab, cyclenext, prev

# Volume and Mute Control (Wireplumber)
binde = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
binde = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute,        exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = , XF86AudioMicMute,     exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

input {
	kb_layout = de
}

exec-once = waybar
exec-once = hyprpaper

general {
    gaps_in = 5
    gaps_out = 13
    border_size = 0
    col.active_border = rgba(56b6c2aa)
    col.inactive_border = rgba(595959aa)
    layout = dwindle
}

decoration {
    rounding = 10

    blur {
        enabled = false
            
            }

    #drop_shadow = true
    inactive_opacity = 0.9

    #shadow_range = 5
    #shadow_render_power = 2
    #col.shadow = rgb(18181F)
}

animations {
    enabled = yes

    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    bezier = easeOutCubic, 0.33, 1, 0.68, 1

    animation = windows, 1, 7, myBezier
    animation = windowsIn, 1, 7, myBezier, slide
    animation = windowsOut, 1, 7, default, slide
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 10, easeOutCubic, slide
}
